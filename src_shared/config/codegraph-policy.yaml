schema_version: 1

executable: codegraph
minimum_version: 1.5.0
index_directory: .codegraph
initialize_if_missing: true
sync_on_prepare: true
timeout_seconds: 300

worker_roles:
  - refinement
  - implementation
  - diagnostic

query_commands:
  - status
  - query
  - explore
  - node
  - files
  - callers
  - callees
  - impact
  - affected

explore_max_files: 8

affected:
  depth: 3
  test_filters:
    - tests/unit/**/*.py
    - tests/integration/**/*.py
    - tests/e2e/**/*.py
    - tests/**/*.test.ts
    - tests/**/*.spec.ts

schema_version: 1
seal_schema_version: 1
prepare_schema_version: 1

paths:
  seal: delivery-seal.yaml
  summary: implementation-summary.md
  reviews: reviews
  audit_attempt: audit-attempt.yaml
  prepare_state: wrap-preparation.yaml
  implemented_root: docs/epics/_implemented
  codegraph_policy: codegraph-policy.yaml

audit_attempt_pattern: '^audit-[0-9]{3}$'
worktree_branch: 'epic/{epic_id}'

labels:
  closure: 'wrap({epic_id}): finalize delivery'
  merge: 'merge({epic_id}): complete epic'

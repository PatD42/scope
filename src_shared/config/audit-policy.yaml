schema_version: 2
attempt_version: 3
matrix_version: 3
findings_version: 3
implementation_evidence_version: 3

allowed_modes:
  - full
  - targeted

attempt_statuses:
  - pending
  - pass
  - fail
  - blocked

gate_statuses:
  - pending
  - pass
  - fail
  - blocked
  - not_applicable

row_statuses:
  - ready
  - pass
  - fail
  - unverified
  - blocked
  - not_applicable

row_priorities:
  - required
  - runtime_required
  - high_risk
  - optional
  - documentation

review_decisions:
  - pass
  - findings
  - blocked
  - unverified

review_providers:
  - claude
  - codex
  - agy

review_missions:
  - semantic_core

risk_review_policy:
  low:
    providers:
      - claude
      - codex
      - agy
    capability_focus: false
  medium:
    providers:
      - claude
      - codex
      - agy
    capability_focus: false
  high:
    providers:
      - claude
      - codex
      - agy
    capability_focus: true
  critical:
    providers:
      - claude
      - codex
      - agy
    capability_focus: true

review_budget:
  maximum_full_attempts: 1
  maximum_targeted_attempts: 1

implementation_evidence:
  story_statuses:
    - verified
    - implementation_complete_unverified
    - blocked
  command_kinds:
    - test
    - regression
    - static
    - contract
    - runtime
    - operational
    - inspection
  command_statuses:
    - pass
    - fail
    - blocked

finding:
  severities:
    - blocking
    - major
    - minor
  categories:
    - implementation
    - architecture_contract
    - native_contract
    - testability
    - runtime_evidence
    - operations
    - security
    - data_integrity
    - documentation
    - mechanical
    - specialist
  sources:
    - deterministic
    - reviewer
  dispositions:
    - remediation_required
    - user_decision
    - documentation_decision
    - accepted_risk
    - false_positive
  statuses:
    - open
    - remediated_pending_verification
    - verified
    - accepted_risk
    - rejected

terminal_finding_statuses:
  - verified
  - accepted_risk
  - rejected

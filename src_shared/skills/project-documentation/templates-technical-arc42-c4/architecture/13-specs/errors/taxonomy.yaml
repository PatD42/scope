# Error Taxonomy
# Master registry of all error codes across the system

version: "1.0.0"
last_updated: "YYYY-MM-DD"
last_updated_by_epic: "SCOPE-XXX"

# HTTP Status Code Mapping
http_status_mapping:
  400: "client_error"       # Bad request, validation errors
  401: "authentication"     # Not authenticated
  403: "authorization"      # Not authorized
  404: "not_found"          # Resource not found
  409: "conflict"           # Resource conflict
  422: "validation"         # Semantic validation error
  429: "rate_limit"         # Too many requests
  500: "internal"           # Internal server error
  502: "bad_gateway"        # Upstream service error
  503: "unavailable"        # Service unavailable
  504: "timeout"            # Gateway timeout

# Error Code Format: {DOMAIN}_{NNN}
# Domain prefixes: 3-5 uppercase letters
# Number: 3 digits, grouped by category

domains:
  # Authentication & Authorization
  AUTH:
    prefix: "AUTH"
    description: "Authentication and session errors"
    file: "./by-domain/auth.yaml"
    ranges:
      "001-099": "Authentication errors"
      "100-199": "Session errors"
      "200-299": "Token errors"

  # Validation
  VAL:
    prefix: "VAL"
    description: "Request validation errors"
    file: "./by-domain/validation.yaml"
    ranges:
      "001-099": "Field validation"
      "100-199": "Business rule validation"

  # Resource
  RES:
    prefix: "RES"
    description: "Resource operation errors"
    file: "./by-domain/resource.yaml"
    ranges:
      "001-099": "Not found errors"
      "100-199": "Conflict errors"
      "200-299": "State errors"

  # System
  SYS:
    prefix: "SYS"
    description: "System and infrastructure errors"
    file: "./by-domain/system.yaml"
    ranges:
      "001-099": "Internal errors"
      "100-199": "External service errors"
      "200-299": "Rate limiting"

# Quick Reference (all codes)
# Updated by /update_spec when epic specs are merged
all_codes:
  # AUTH domain
  AUTH_001:
    status: 401
    name: "invalid_credentials"
    message: "Invalid username or password"
    retry: false
    added_by: "Initial"

  AUTH_002:
    status: 401
    name: "token_expired"
    message: "Access token has expired"
    retry: false
    action: "Refresh token or re-authenticate"
    added_by: "Initial"

  AUTH_003:
    status: 403
    name: "insufficient_permissions"
    message: "You do not have permission to perform this action"
    retry: false
    added_by: "Initial"

  # VAL domain
  VAL_001:
    status: 400
    name: "invalid_request"
    message: "Request body is invalid"
    retry: false
    added_by: "Initial"

  VAL_002:
    status: 422
    name: "validation_failed"
    message: "One or more fields failed validation"
    retry: false
    added_by: "Initial"

  # RES domain
  RES_001:
    status: 404
    name: "not_found"
    message: "The requested resource was not found"
    retry: false
    added_by: "Initial"

  RES_002:
    status: 409
    name: "already_exists"
    message: "A resource with this identifier already exists"
    retry: false
    added_by: "Initial"

  # SYS domain
  SYS_001:
    status: 500
    name: "internal_error"
    message: "An unexpected error occurred"
    retry: true
    retry_after: 5
    added_by: "Initial"

  SYS_002:
    status: 503
    name: "service_unavailable"
    message: "The service is temporarily unavailable"
    retry: true
    retry_after: 30
    added_by: "Initial"

# Edge Cases Registry
# Common edge cases and their expected handling
edge_cases:
  - scenario: "Concurrent modification"
    detection: "Version/ETag mismatch"
    error_code: "RES_003"
    handling: "Return 409 with current version"
    added_by: "Initial"

  - scenario: "Rate limit exceeded"
    detection: "Request count > threshold"
    error_code: "SYS_003"
    handling: "Return 429 with Retry-After header"
    added_by: "Initial"


# Standard Error Response Schema
# Used across all APIs

$schema: https://json-schema.org/draft/2020-12/schema
$id: /schemas/common/error
title: ErrorResponse
description: Standard error response format for all APIs

type: object
required:
  - code
  - message

properties:
  code:
    type: string
    description: Machine-readable error code (e.g., AUTH_001, VAL_002)
    pattern: "^[A-Z]{2,5}_[0-9]{3}$"
    examples:
      - "AUTH_001"
      - "VAL_001"
      - "RES_001"

  message:
    type: string
    description: Human-readable error message
    maxLength: 500

  details:
    type: object
    description: Additional error context (optional)
    additionalProperties: true
    examples:
      - field: "email"
        reason: "Invalid format"
      - retry_after: 30
        rate_limit: 100

  request_id:
    type: string
    format: uuid
    description: Request correlation ID for debugging

  timestamp:
    type: string
    format: date-time
    description: When the error occurred


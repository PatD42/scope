# Standard Pagination Response Schema
# Used for list endpoints

$schema: https://json-schema.org/draft/2020-12/schema
$id: /schemas/common/pagination
title: Pagination
description: Standard pagination metadata for list responses

type: object
required:
  - page
  - limit
  - total

properties:
  page:
    type: integer
    minimum: 1
    description: Current page number

  limit:
    type: integer
    minimum: 1
    maximum: 100
    description: Items per page

  total:
    type: integer
    minimum: 0
    description: Total number of items

  total_pages:
    type: integer
    minimum: 0
    description: Total number of pages

  has_next:
    type: boolean
    description: Whether there are more pages

  has_previous:
    type: boolean
    description: Whether there are previous pages

  next_cursor:
    type: string
    description: Cursor for next page (for cursor-based pagination)

  previous_cursor:
    type: string
    description: Cursor for previous page (for cursor-based pagination)


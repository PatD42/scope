name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate Scope Prompts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Scope prompts
        run: ./scripts/validate-pr-checks.sh

schema_version: 2
provider: claude

workers:
  refinement:
    phases:
      product: {model: fable, reasoning_effort: high}
      design: {model: fable, reasoning_effort: max}
      handoff: {model: opus, reasoning_effort: high}
      correction: {model: opus, reasoning_effort: high}
      finalize: {model: fable, reasoning_effort: high}
  implementation:
    phases:
      story: {model: sonnet, reasoning_effort: max}
      epic_verify: {model: opus, reasoning_effort: max}
      audit_remediation: {model: opus, reasoning_effort: max}
      debugging: {model: opus, reasoning_effort: xhigh}
      delivery_summary: {model: sonnet, reasoning_effort: medium}
  audit:
    phases:
      merge_findings: {model: sonnet, reasoning_effort: medium}
  diagnostic:
    phases:
      investigate: {model: sonnet, reasoning_effort: high}

workers_on_budget:
  refinement:
    phases:
      product: {model: fable, reasoning_effort: high}
      design: {model: fable, reasoning_effort: high}
      handoff: {model: opus, reasoning_effort: high}
      correction: {model: opus, reasoning_effort: high}
      finalize: {model: fable, reasoning_effort: high}
  implementation:
    phases:
      story: {model: sonnet, reasoning_effort: high}
      epic_verify: {model: opus, reasoning_effort: high}
      audit_remediation: {model: opus, reasoning_effort: high}
      debugging: {model: opus, reasoning_effort: high}
      delivery_summary: {model: sonnet, reasoning_effort: medium}
  audit:
    phases:
      merge_findings: {model: sonnet, reasoning_effort: medium}
  diagnostic:
    phases:
      investigate: {model: sonnet, reasoning_effort: medium}

provider_settings:
  executable: claude
  permission_mode: dontAsk

runtime:
  roles:
    refinement: {timeout_seconds: 7200}
    implementation: {timeout_seconds: 14400}
    audit: {timeout_seconds: 7200}
    diagnostic: {timeout_seconds: 3600}
  lifecycle:
    poll_interval_seconds: 1
    heartbeat_interval_seconds: 10
    normal_exit_grace_seconds: 0.5
    termination_grace_seconds: 3
    log_tail_lines: 40
    log_tail_characters: 8000
